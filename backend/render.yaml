# Render Blueprint — open https://dashboard.render.com/blueprints and connect this repo.
# After first deploy, set CODE_ENCRYPTION_KEY (openssl rand -hex 32) and CORS origins
# to your frontend URL. Do not rotate CODE_ENCRYPTION_KEY once codes exist.

services:
  - type: web
    name: mmh-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOW_DEMO_AUTO_PAYMENT
        value: "false"
      - key: ONEEPIN_ALLOW_LIVE
        value: "false"
      - key: SUPPLIER_MODE
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: CODE_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: mmh-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: mmh-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: mmh-postgres
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: mmh-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: mmh-postgres
          property: port

databases:
  - name: mmh-postgres
    plan: free
    databaseName: mmh
    user: mmh
