name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmh
          POSTGRES_USER: mmh
          POSTGRES_PASSWORD: mmh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmh -d mmh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: development
      DEBUG: "true"
      SECRET_KEY: ci-secret-key-not-for-production-use-32c
      POSTGRES_DB: mmh
      POSTGRES_USER: mmh
      POSTGRES_PASSWORD: mmh_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      ALLOW_DEMO_AUTO_PAYMENT: "true"
      ONEEPIN_ALLOW_LIVE: "false"
      CODE_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      API_URL: http://127.0.0.1:8000/api/v1
      AUTH_SECRET: ci-auth-secret-not-for-production-32chars
      AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
